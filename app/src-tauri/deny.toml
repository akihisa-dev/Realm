[graph]
all-features = true
targets = ["aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
maximum-db-staleness = "P1D"
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "Current Tauri transitive Unicode parser dependency; no compatible maintained replacement is available." },
  { id = "RUSTSEC-2025-0080", reason = "Current Tauri transitive Unicode parser dependency; no compatible maintained replacement is available." },
  { id = "RUSTSEC-2025-0081", reason = "Current Tauri transitive Unicode parser dependency; no compatible maintained replacement is available." },
  { id = "RUSTSEC-2025-0098", reason = "Current Tauri transitive Unicode parser dependency; no compatible maintained replacement is available." },
  { id = "RUSTSEC-2025-0100", reason = "Current Tauri transitive Unicode parser dependency; no compatible maintained replacement is available." },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "AGPL-3.0-or-later",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
