name: Draft Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    env:
      TAG_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate exact version tag
        shell: bash
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(ruby -rjson -e 'puts JSON.parse(File.read("app/package.json"))["version"]')"
          test "$TAG_NAME" = "$version"

  build:
    name: Verify and build macOS arm64
    needs: validate-tag
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Setup pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          rustup default 1.97.1
      - name: Install pinned audit tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run full release gate
        working-directory: app
        run: pnpm verify:local:release
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Realm-${{ github.ref_name }}-macOS-arm64
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create GitHub Draft Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Realm-${{ github.ref_name }}-macOS-arm64
          path: release-assets
      - name: Validate artifacts and checksum
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "release-assets/Realm-${TAG_NAME}-macOS-arm64.dmg"
            "release-assets/Realm-${TAG_NAME}-macOS-arm64.dmg.sha256"
            "release-assets/THIRD_PARTY_NOTICES.md"
            "release-assets/realm-dependencies.cdx.json"
          )
          test "$(find release-assets -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          for file in "${expected[@]}"; do
            test -s "$file"
            test ! -L "$file"
          done
          (cd release-assets && shasum -a 256 -c "Realm-${TAG_NAME}-macOS-arm64.dmg.sha256")
      - name: Create draft without overwriting published releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = true
            test -z "$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          else
            gh release create "$TAG_NAME" --draft --generate-notes --title "$TAG_NAME" --verify-tag
          fi
          gh release upload "$TAG_NAME" \
            "release-assets/Realm-${TAG_NAME}-macOS-arm64.dmg" \
            "release-assets/Realm-${TAG_NAME}-macOS-arm64.dmg.sha256" \
            "release-assets/THIRD_PARTY_NOTICES.md" \
            "release-assets/realm-dependencies.cdx.json"
