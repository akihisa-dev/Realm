name: Pre-release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and inspect unsigned package
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Setup pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          rustup default 1.97.1
      - name: Install pinned audit tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run full release gate
        working-directory: app
        run: pnpm verify:local:release
      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Realm-${{ github.sha }}-macOS-arm64
          path: release-assets
          if-no-files-found: error
          retention-days: 7
