name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Shell, YAML, and whitespace
        run: |
          set -eu
          sh -n .githooks/*.sh .githooks/pre-commit .githooks/pre-push
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.safe_load(File.read(file), [], [], true, file) }' .github/workflows/*.yml .github/ISSUE_TEMPLATE/*.yml
          git diff --check
      - name: Secret guard self-test
        run: .githooks/secret-guard.sh --self-test
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .githooks/secret-guard.sh --range "${BASE_SHA}..${HEAD_SHA}"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            .githooks/secret-guard.sh --range "$HEAD_SHA"
          else
            .githooks/secret-guard.sh --range "${BEFORE_SHA}..${HEAD_SHA}"
          fi

  application:
    name: macOS arm64 application
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
      - name: Setup pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target aarch64-apple-darwin
          rustup default 1.97.1
      - name: Install pinned audit tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install locked dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run strict application verification
        working-directory: app
        run: pnpm verify:ci
