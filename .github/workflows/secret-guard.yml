name: Secret Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Shell syntax
        run: sh -n .githooks/secret-guard.sh .githooks/pre-commit .githooks/pre-push
      - name: Self-test
        run: .githooks/secret-guard.sh --self-test
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .githooks/secret-guard.sh --range "${BASE_SHA}..${HEAD_SHA}"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            .githooks/secret-guard.sh --range "$HEAD_SHA"
          else
            .githooks/secret-guard.sh --range "${BEFORE_SHA}..${HEAD_SHA}"
          fi
      - name: Scan checked-out history
        if: github.event_name == 'workflow_dispatch'
        run: .githooks/secret-guard.sh --range HEAD
